<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KEX Job & Rate Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navbar -->
    <nav class="bg-red-600 text-white shadow-md sticky top-0 z-50 border-b-4 border-yellow-400">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row justify-between items-center gap-3">
            <div class="flex items-center space-x-3">
                <div class="w-12 h-12 bg-white rounded-xl flex items-center justify-center p-1 shadow-md border-2 border-yellow-400 overflow-hidden">
                    <img src="logo.jpg" alt="KEX Logo" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/100x100?text=KEX';">
                </div>
                <div>
                    <h1 class="text-lg font-bold tracking-wide">KEX JOB & RATE PORTAL</h1>
                    <p class="text-xs text-yellow-200">ระบบจองรอบวิ่ง KEX</p>
                </div>
            </div>
            <div class="flex flex-wrap gap-2 items-center">
                <button onclick="switchTab('jobs')" id="btn-jobs" class="font-bold px-3.5 py-2 rounded-lg transition text-sm shadow bg-white text-red-700">คลังที่มีโควตาเปิดรับ</button>
                <button onclick="switchTab('apply')" id="btn-apply" class="font-bold px-3.5 py-2 rounded-lg transition text-sm shadow bg-yellow-400 text-red-900 hover:bg-yellow-300">ฝากประวัติสมัครงาน</button>
                
                <a href="https://lin.ee/QIxgtNg" target="_blank" class="font-bold px-3.5 py-2 rounded-lg transition text-sm shadow bg-emerald-500 text-white hover:bg-emerald-600 flex items-center gap-1.5 border border-emerald-400">
                    💬 ติดต่อแอดมิน (LINE)
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">
        <!-- Tab 1: คลังเปิดรับ -->
        <section id="tab-jobs" class="space-y-4">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div>
                        <h2 class="text-lg font-bold text-gray-900">📍 รายชื่อคลังสินค้า KEX และโควตาเปิดรับสมัคร</h2>
                        <p class="text-xs font-medium text-gray-600">ซิงค์ข้อมูลแบบเรียลไทม์จาก Google Sheets</p>
                    </div>
                    <input type="text" id="searchInput" onkeyup="filterJobs()" placeholder="🔍 ค้นหาชื่อคลัง หรือ DC Code..." class="px-4 py-2 border rounded-xl text-sm w-full md:w-72 focus:ring-2 focus:ring-red-500 focus:outline-none">
                </div>
                <div id="job-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <p class="text-gray-600 text-sm col-span-full text-center py-8">กำลังโหลดข้อมูลจาก Google Sheets...</p>
                </div>
            </div>
        </section>

        <!-- Tab 2: สมัครงาน -->
        <section id="tab-apply" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 max-w-2xl mx-auto">
                <h2 class="text-lg font-bold text-gray-900 text-center mb-1">ฝากประวัติสมัครงาน / จองรอบวิ่ง</h2>
                <p class="text-xs font-medium text-gray-600 text-center mb-6">กรอกข้อมูลส่วนตัวเพื่อให้เจ้าหน้าที่ติดต่อกลับทันทีที่มีโควตาว่าง</p>
                
                <form id="applyForm" class="space-y-4">
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">ชื่อ - นามสกุล (ภาษาไทย) *</label>
                            <input type="text" id="apply-name" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">เบอร์โทรศัพท์ *</label>
                            <input type="tel" id="apply-phone" required class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">ID Line</label>
                            <input type="text" id="apply-line" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">ประเภทรถที่ใช้งาน *</label>
                            <select id="apply-vehicle" required class="w-full px-3 py-2 border rounded-xl text-sm bg-white focus:ring-2 focus:ring-red-500 focus:outline-none">
                                <option value="">-- เลือกประเภทรถ --</option>
                                <option value="รถ 4 ล้อ (4W)">รถ 4 ล้อ (4W)</option>
                                <option value="มอเตอร์ไซค์ (2W)">มอเตอร์ไซค์ (2W)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">ทะเบียนรถ</label>
                            <input type="text" id="apply-plate" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">พื้นที่ที่สะดวกวิ่ง</label>
                            <input type="text" id="apply-area" placeholder="เช่น สาทร, บางนา" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-700 mb-1">วันที่พร้อมเริ่มงาน</label>
                            <input type="date" id="apply-date" class="w-full px-3 py-2 border rounded-xl text-sm focus:ring-2 focus:ring-red-500 focus:outline-none">
                        </div>
                    </div>
                    <button type="submit" id="btn-submit-apply" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 rounded-xl text-sm transition shadow-md border-b-2 border-yellow-400">
                        ฝากประวัติสมัครงาน
                    </button>
                </form>
            </div>
        </section>
    </main>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz4HLcHhtWJqoedtQ12mDIPHNKpxWGw6dfeAN-hL-o2Y1V-S8ZKrz4YferUEgDGVER2EA/exec';
        let allJobData = [];

        function switchTab(tabId) {
            ['jobs', 'apply'].forEach(t => {
                document.getElementById('tab-' + t).classList.add('hidden');
                document.getElementById('btn-' + t).className = 'font-bold px-3.5 py-2 rounded-lg transition text-sm shadow bg-yellow-400 text-red-900 hover:bg-yellow-300';
            });
            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).className = 'font-bold px-3.5 py-2 rounded-lg transition text-sm shadow bg-white text-red-700';
        }

        function loadSheetData() {
            fetch(SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (!Array.isArray(data)) {
                        console.error("Data format error:", data);
                        return;
                    }
                    const validData = data.filter(row => row['DC Code'] && row['DC Code'].toString().trim() !== '' && row['DC Code'] !== '35');
                    if(validData.length === 0) {
                        document.getElementById('job-cards-container').innerHTML = '<p class="text-gray-600 text-sm col-span-full text-center">ไม่พบข้อมูลคลังสินค้า</p>';
                        return;
                    }
                    allJobData = validData;
                    renderJobs(validData);
                })
                .catch(err => {
                    console.error("Error loading data:", err);
                    document.getElementById('job-cards-container').innerHTML = '<p class="text-red-600 text-sm col-span-full text-center">เกิดข้อผิดพลาดในการโหลดข้อมูล กรุณารีเฟรช</p>';
                });
        }

        function renderJobs(data) {
            let html = '';
            data.forEach(row => {
                const dc = row['DC Code'] || '';
                const name = row['ชื่อคลัง'] || '';
                const coords = row['Google Maps Link'] || ''; // พิกัด GPS
                const w4 = row['4W'] || '0';
                const w2 = row['2W'] || '0';

                // สร้างลิงก์ Google Maps จากพิกัด
                let mapUrl = '#';
                if (coords.trim() !== '') {
                    mapUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(coords)}`;
                }

                html += `
                    <div class="bg-gray-50 border border-gray-200 rounded-2xl p-4 flex flex-col justify-between shadow-sm hover:shadow-md transition">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="bg-red-100 text-red-900 text-xs font-extrabold px-2.5 py-1 rounded-lg">${dc}</span>
                                <div class="flex gap-2 text-xs font-bold">
                                    <span class="bg-amber-100 text-amber-900 px-2 py-0.5 rounded shadow-sm">📦 4W: ${w4}</span>
                                    <span class="bg-emerald-100 text-emerald-900 px-2 py-0.5 rounded shadow-sm">🛵 2W: ${w2}</span>
                                </div>
                            </div>
                            <h3 class="font-extrabold text-gray-900 text-base mb-1">${name}</h3>
                            <p class="text-xs font-semibold text-gray-700 mb-3 line-clamp-2">พิกัด: ${coords || '-'}</p>
                        </div>
                        <div>
                            ${coords ? `<a href="${mapUrl}" target="_blank" class="text-xs font-bold text-red-600 hover:text-red-800 hover:underline inline-block mb-3">📍 เปิดดูแผนที่ Google Maps</a>` : ''}
                            <button onclick="bookJob('${name}')" class="w-full bg-red-600 hover:bg-red-700 text-white text-xs font-bold py-2 rounded-xl transition shadow">
                                จองรอบวิ่ง KEX คลังนี้
                            </button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('job-cards-container').innerHTML = html;
        }

        function filterJobs() {
            const keyword = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allJobData.filter(item => 
                (item['DC Code'] && item['DC Code'].toLowerCase().includes(keyword)) ||
                (item['ชื่อคลัง'] && item['ชื่อคลัง'].toLowerCase().includes(keyword)) ||
                (item['Google Maps Link'] && item['Google Maps Link'].toLowerCase().includes(keyword))
            );
            renderJobs(filtered);
        }

        function bookJob(warehouseName) {
            switchTab('apply');
            document.getElementById('apply-area').value = warehouseName;
        }

        document.getElementById('applyForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-submit-apply');
            btn.innerText = 'กำลังบันทึกประวัติ...';
            btn.disabled = true;

            const payload = {
                type: 'ฝากประวัติสมัครงาน',
                fullname: document.getElementById('apply-name').value,
                phone: document.getElementById('apply-phone').value,
                lineId: document.getElementById('apply-line').value,
                vehicle: document.getElementById('apply-vehicle').value,
                licensePlate: document.getElementById('apply-plate').value,
                detail: `คลังที่สนใจ/พื้นที่: ${document.getElementById('apply-area').value} | พร้อมเริ่ม: ${document.getElementById('apply-date').value}`
            };

            try {
                await fetch(SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                alert('ฝากประวัติสมัครงานเรียบร้อยแล้ว!\n\n⚠️ รบกวนกดปุ่ม "ติดต่อแอดมิน (LINE)" ด้านบน เพื่อแจ้งข้อมูลและยืนยันรับงานทันทีครับ!');
                
                e.target.reset();
                switchTab('jobs');
            } catch (error) {
                alert('เกิดข้อผิดพลาด กรุณาลองใหม่');
            } finally {
                btn.innerText = 'ฝากประวัติสมัครงาน';
                btn.disabled = false;
            }
        });

        loadSheetData();
    </script>
</body>
</html>
